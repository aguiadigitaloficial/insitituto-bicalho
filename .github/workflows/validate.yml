name: Validate website
on:
  push:
    branches: [main, codex/blog-editorial, codex/cloudflare-blog]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    # Use the OS dependency set supported by the installed Playwright release.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUBLIC_INDEXABLE: 'false'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:blog:core
      - run: npm run test:blog:images
      - name: SSR, editorial UI and existing website regression suite
        run: npm run test:blog:browser
        env:
          BLOG_RUN_LEGACY: 'true'
      - run: npm run build:cloudflare
      - run: npm run test:blog:worker
      - name: Cloudflare runtime and editorial UI
        run: npm run test:blog:browser
        env:
          BLOG_TEST_TARGET: cloudflare
          BLOG_QUICK: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-checks
          path: artifacts/
          retention-days: 14
